<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSE Physics MC Practice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6feb'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EMC%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--ink:#1b2430;--muted:#5d6b7a;--line:#dde2e8;--accent:#1f6feb;--accent-soft:#e8f0fe;
    --good:#1a7f37;--good-soft:#dafbe1;--bad:#cf222e;--bad-soft:#ffebe9;--warn:#9a6700;--chip:#eef1f4;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:24px 14px 60px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:clamp(1.4rem,4vw,1.9rem);margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-top:18px}
  .card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
  .row{margin-bottom:18px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:.95rem;cursor:pointer;user-select:none}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .hint{color:var(--muted);font-size:.85rem;margin-top:6px}
  .btn{font:inherit;border:0;border-radius:12px;padding:11px 20px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  .btn.small{padding:7px 12px;font-size:.9rem}
  .count{font-weight:600;color:var(--accent)}
  .langsw{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .langsw button{font:inherit;border:0;background:var(--panel);padding:6px 12px;cursor:pointer;color:var(--muted)}
  .langsw button.on{background:var(--accent);color:#fff}
  /* quiz */
  .qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
  .prog{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin:10px 0 0}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 8px;font-size:.8rem;font-weight:600;margin-right:6px}
  .tag.ext{background:#fff4d6;color:var(--warn)}
  .qimg{width:100%;height:auto;display:block;border-radius:8px;margin:14px 0;background:#fff}
  .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .opt{font:inherit;font-size:1.25rem;font-weight:700;padding:14px 0;border-radius:12px;border:2px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
  .feedback{margin-top:12px;padding:10px 14px;border-radius:10px;font-weight:600}
  .feedback.ok{background:var(--good-soft);color:var(--good)}
  .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
  .timer.low{color:var(--bad)}
  .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
  .dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:.78rem;cursor:pointer;color:var(--muted)}
  .dot.ans{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .dot.cur{outline:2px solid var(--accent);outline-offset:1px}
  .dot.flag{border-color:var(--warn);border-width:2px}
  /* results */
  .big{font-size:2.6rem;font-weight:800;margin:0}
  table{width:100%;border-collapse:collapse;font-size:.93rem}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
  .bar{height:8px;background:var(--chip);border-radius:9px;overflow:hidden;min-width:60px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
  .rev{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  footer{color:var(--muted);font-size:.8rem;margin-top:30px;text-align:center}
  .hidden{display:none!important}
  @media(max-width:520px){.opt{font-size:1.1rem;padding:12px 0}.card{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="subtitle"></p>
    </div>
    <div class="langsw" role="group" aria-label="Language">
      <button id="lgE" onclick="setLang('E')">English</button>
      <button id="lgC" onclick="setLang('C')">中文</button>
    </div>
  </header>

  <!-- SETUP -->
  <section id="setup">
    <div class="card">
      <div class="row">
        <h2 data-t="years"></h2>
        <div class="chips" id="yearChips"></div>
      </div>
      <div class="row">
        <h2 data-t="topics"></h2>
        <div class="chips" id="topicChips"></div>
      </div>
      <div class="row">
        <h2 data-t="ext"></h2>
        <div class="chips">
          <button class="chip" id="extChip" aria-pressed="true" onclick="toggle(this);refresh()"></button>
        </div>
        <div class="hint" data-t="extHint"></div>
      </div>
      <div class="row">
        <h2 data-t="howMany"></h2>
        <div class="chips" id="numChips"></div>
      </div>
      <div class="row">
        <h2 data-t="order"></h2>
        <div class="chips" id="orderChips"></div>
      </div>
      <div class="row">
        <h2 data-t="mode"></h2>
        <div class="chips" id="modeChips"></div>
        <div class="hint" id="modeHint"></div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <button class="btn" id="startBtn" onclick="start()"></button>
        <span id="poolInfo" class="hint" style="margin:0"></span>
      </div>
    </div>
    <div class="card" id="wrongCard">
      <h2 data-t="myWrong"></h2>
      <p id="wrongInfo" style="margin:0 0 10px"></p>
      <button class="btn ghost small" id="wrongBtn" onclick="startWrong()"></button>
      <button class="btn ghost small" onclick="clearWrong()" data-t="clear"></button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="card">
      <div class="qbar">
        <div><span id="qPos"></span> &nbsp; <span id="qTags"></span></div>
        <div id="timerBox" class="hidden">⏱ <span class="timer" id="timer"></span></div>
      </div>
      <div class="prog"><i id="progBar"></i></div>
      <a id="qLink" target="_blank" rel="noopener"><img class="qimg" id="qImg" alt=""></a>
      <div class="hint" style="margin-top:-8px;text-align:right" data-t="zoom"></div>
      <div class="opts" id="opts"></div>
      <div id="fb" class="feedback hidden"></div>
      <div class="nav">
        <div style="display:flex;gap:8px">
          <button class="btn ghost small" id="prevBtn" onclick="go(-1)"></button>
          <button class="btn ghost small" id="flagBtn" onclick="flag()"></button>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn ghost small" onclick="quit()" data-t="quit"></button>
          <button class="btn small" id="nextBtn" onclick="go(1)"></button>
        </div>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="card">
      <h2 data-t="result"></h2>
      <p class="big" id="score"></p>
      <p class="sub" id="scoreSub"></p>
      <table style="margin-top:14px">
        <thead><tr><th data-t="topic"></th><th data-t="correct"></th><th></th></tr></thead>
        <tbody id="topicTable"></tbody>
      </table>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px">
        <button class="btn" onclick="showSetup()" data-t="newSet"></button>
        <button class="btn ghost" id="redoBtn" onclick="redoWrong()"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-t="review"></h2>
      <div class="chips" style="margin-bottom:6px">
        <button class="chip" id="onlyWrongChip" aria-pressed="true" onclick="toggle(this);renderReview()"></button>
      </div>
      <div id="reviewList"></div>
    </div>
  </section>

  <footer data-t="footer"></footer>
</div>

<script>
const T = {
  E:{title:"DSE Physics MC Practice",subtitle:"HKDSE Paper 1A past-paper questions — choose by year or topic",
     years:"Year",topics:"Topic",ext:"Extension questions (*)",extOn:"Include * questions",extHint:"Questions marked * involve the extension component (not for Category A students).",
     howMany:"Number of questions",all:"All",order:"Order",random:"Random",paper:"Paper order",mode:"Mode",
     practice:"Practice",exam:"Exam",practiceHint:"See the answer straight after each question.",examHint:"Timed (1.8 min per question, like the real exam). Answers shown at the end.",
     start:"Start",pool:n=>`${n} question(s) match your choices`,myWrong:"My wrong questions",
     wrongInfo:n=>n?`You have ${n} question(s) you answered wrongly before (saved on this device).`:"No wrong questions saved yet.",
     redoSaved:"Practise these",clear:"Clear",prev:"← Prev",next:"Next →",finish:"Finish",flag:"⚑ Flag",unflag:"⚑ Unflag",quit:"Quit",
     q:(i,n)=>`Question ${i} of ${n}`,correctFb:"✓ Correct!",wrongFb:k=>`✗ The answer is ${k}.`,pct:p=>` (${p}% of DSE candidates got this right)`,
     confirmFinish:n=>`${n} question(s) not answered. Finish anyway?`,confirmQuit:"Quit this set? Your answers will be lost.",
     result:"Result",scoreSub:(c,n,t)=>`${c} out of ${n} correct${t?` · time used ${t}`:""}`,topic:"Topic",correct:"Correct",
     newSet:"New set",redo:n=>`Redo ${n} wrong`,review:"Review",onlyWrong:"Show wrong / unanswered only",
     yours:"Your answer",key:"Answer",none:"—",paperQ:(y,n)=>`${y} DSE Q${n}`,
     footer:"For internal teaching use only. Questions © Hong Kong Examinations and Assessment Authority.",timeUp:"Time is up!",zoom:"Tap the question to enlarge",
     topicsN:{heat:"Heat",mech:"Mechanics",wave:"Waves",em:"Electricity & Magnetism",nuc:"Radioactivity & Nuclear Energy"}},
  C:{title:"DSE 物理 多項選擇題練習",subtitle:"香港中學文憑試 卷一甲 歷屆試題 — 按年份或課題練習",
     years:"年份",topics:"課題",ext:"延伸部分題目 (*)",extOn:"包括 * 題目",extHint:"標有 * 的題目涉及延伸部分（甲類學生毋須作答）。",
     howMany:"題目數量",all:"全部",order:"次序",random:"隨機",paper:"按試卷次序",mode:"模式",
     practice:"練習",exam:"考試",practiceHint:"每題作答後即時顯示答案。",examHint:"計時（每題 1.8 分鐘，與正式考試相同），完成後才顯示答案。",
     start:"開始",pool:n=>`共有 ${n} 題符合你的選擇`,myWrong:"我的錯題",
     wrongInfo:n=>n?`你之前答錯了 ${n} 題（儲存在此裝置）。`:"暫時未有錯題紀錄。",
     redoSaved:"練習錯題",clear:"清除",prev:"← 上一題",next:"下一題 →",finish:"完成",flag:"⚑ 標記",unflag:"⚑ 取消標記",quit:"離開",
     q:(i,n)=>`第 ${i} 題（共 ${n} 題）`,correctFb:"✓ 答對了！",wrongFb:k=>`✗ 答案是 ${k}。`,pct:p=>`（${p}% 考生答對）`,
     confirmFinish:n=>`尚有 ${n} 題未作答，確定完成？`,confirmQuit:"確定離開？你的答案將不會保留。",
     result:"成績",scoreSub:(c,n,t)=>`${n} 題中答對 ${c} 題${t?` · 用時 ${t}`:""}`,topic:"課題",correct:"答對",
     newSet:"重新選題",redo:n=>`重做 ${n} 道錯題`,review:"題目檢討",onlyWrong:"只顯示答錯／未答",
     yours:"你的答案",key:"答案",none:"—",paperQ:(y,n)=>`${y} DSE 第 ${n} 題`,
     footer:"只供校內教學用途。試題版權屬香港考試及評核局所有。",timeUp:"時間到！",zoom:"點擊題目可放大",
     topicsN:{heat:"熱學",mech:"力學",wave:"波動學",em:"電與磁",nuc:"放射性及核能"}}
};
const TOPICS=["heat","mech","wave","em","nuc"];
let Q=[], lang="E", S=null, timerId=null;
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const qid=q=>`${q.y}-${String(q.n).padStart(2,"0")}`;
const img=q=>`img/${q.y}-${lang}-${String(q.n).padStart(2,"0")}.png`;

function chip(label,val,pressed,onclick){const b=document.createElement("button");b.className="chip";b.textContent=label;b.dataset.v=val;b.setAttribute("aria-pressed",pressed);b.onclick=onclick||(()=>{toggle(b);refresh()});return b}
function toggle(b){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")}
function radio(container,b){[...container.children].forEach(c=>c.setAttribute("aria-pressed",c===b));refresh()}
const on=id=>[...$(id).children].filter(c=>c.getAttribute("aria-pressed")==="true").map(c=>c.dataset.v);

function buildSetup(){
  const t=T[lang], years=[...new Set(Q.map(q=>q.y))].sort((a,b)=>b-a);
  const keep=(id,def)=>{const prev=$(id).children.length?on(id):null;return v=>prev?prev.includes(String(v)):def(v)};
  const ky=keep("yearChips",()=>true), kt=keep("topicChips",()=>true), kn=keep("numChips",v=>v==="10"), ko=keep("orderChips",v=>v==="random"), km=keep("modeChips",v=>v==="practice");
  $("yearChips").replaceChildren(...years.map(y=>chip(y,y,ky(y))));
  $("topicChips").replaceChildren(...TOPICS.map(k=>chip(t.topicsN[k],k,kt(k))));
  const nc=$("numChips"); nc.replaceChildren(...["10","20","33","all"].map(v=>{const b=chip(v==="all"?t.all:v,v,kn(v));b.onclick=()=>radio(nc,b);return b}));
  const oc=$("orderChips"); oc.replaceChildren(...[["random",t.random],["paper",t.paper]].map(([v,l])=>{const b=chip(l,v,ko(v));b.onclick=()=>radio(oc,b);return b}));
  const mc=$("modeChips"); mc.replaceChildren(...[["practice",t.practice],["exam",t.exam]].map(([v,l])=>{const b=chip(l,v,km(v));b.onclick=()=>radio(mc,b);return b}));
  refresh();
}
function pool(){
  const ys=on("yearChips").map(Number), ts=on("topicChips"), ext=$("extChip").getAttribute("aria-pressed")==="true";
  return Q.filter(q=>ys.includes(q.y)&&ts.includes(q.t)&&(ext||!q.x));
}
function refresh(){
  const t=T[lang], n=pool().length;
  $("poolInfo").textContent=t.pool(n); $("startBtn").disabled=!n;
  $("modeHint").textContent=on("modeChips")[0]==="exam"?t.examHint:t.practiceHint;
  const w=store.get("dsemc_wrong",[]); $("wrongInfo").textContent=t.wrongInfo(w.length); $("wrongBtn").disabled=!w.length;
}
function applyLang(){
  const t=T[lang]; document.documentElement.lang=lang==="C"?"zh-Hant":"en";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  $("lgE").className=lang==="E"?"on":""; $("lgC").className=lang==="C"?"on":"";
  $("extChip").textContent=t.extOn; $("startBtn").textContent=t.start; $("wrongBtn").textContent=t.redoSaved;
  $("prevBtn").textContent=t.prev; $("onlyWrongChip").textContent=t.onlyWrong;
}
function setLang(l){lang=l;store.set("dsemc_lang",l);applyLang();buildSetup();if(S){if(!$("quiz").classList.contains("hidden"))renderQ();if(!$("results").classList.contains("hidden"))renderResults()}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(list){
  let qs=list||pool();
  const order=list?"random":on("orderChips")[0], num=list?"all":on("numChips")[0];
  if(order==="random")shuffle(qs=[...qs]); else qs=[...qs].sort((a,b)=>a.y-b.y||a.n-b.n);
  if(num!=="all")qs=qs.slice(0,+num);
  const mode=list?"practice":on("modeChips")[0];
  S={qs,ans:Array(qs.length).fill(null),flag:Array(qs.length).fill(false),i:0,mode,t0:Date.now(),limit:mode==="exam"?Math.round(qs.length*1.8*60):0};
  $("setup").classList.add("hidden");$("results").classList.add("hidden");$("quiz").classList.remove("hidden");
  clearInterval(timerId);
  if(S.limit){$("timerBox").classList.remove("hidden");tick();timerId=setInterval(tick,1000)}else $("timerBox").classList.add("hidden");
  renderQ(); scrollTo(0,0);
}
function startWrong(){const w=new Set(store.get("dsemc_wrong",[]));start(Q.filter(q=>w.has(qid(q))))}
function clearWrong(){store.set("dsemc_wrong",[]);refresh()}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function tick(){const left=S.limit-Math.floor((Date.now()-S.t0)/1000);$("timer").textContent=fmt(Math.max(0,left));$("timer").classList.toggle("low",left<120);if(left<=0){clearInterval(timerId);alert(T[lang].timeUp);finish(true)}}

function renderQ(){
  const t=T[lang], q=S.qs[S.i], a=S.ans[S.i], n=S.qs.length, reveal=S.mode==="practice"&&a;
  $("qPos").textContent=t.q(S.i+1,n);
  $("qTags").innerHTML=`<span class="tag">${t.topicsN[q.t]}</span>`+(q.x?`<span class="tag ext">*</span>`:"")+`<span style="font-size:.85rem">${t.paperQ(q.y,q.n)}</span>`;
  $("progBar").style.width=`${100*S.ans.filter(Boolean).length/n}%`;
  $("qImg").src=img(q); $("qLink").href=img(q); $("qImg").alt=t.paperQ(q.y,q.n);
  $("opts").replaceChildren(...["A","B","C","D"].map(L=>{const b=document.createElement("button");b.className="opt";b.textContent=L;
    if(reveal){if(L===q.a)b.classList.add("right");else if(L===a)b.classList.add("wrong")}else if(L===a)b.classList.add("sel");
    b.onclick=()=>choose(L);return b}));
  const fb=$("fb");
  if(reveal){fb.classList.remove("hidden");const ok=a===q.a;fb.className="feedback "+(ok?"ok":"no");fb.textContent=(ok?t.correctFb:t.wrongFb(q.a))+(q.p?t.pct(q.p):"")}else fb.classList.add("hidden");
  $("prevBtn").disabled=S.i===0;
  $("nextBtn").textContent=S.i===n-1?t.finish:t.next;
  $("flagBtn").textContent=S.flag[S.i]?t.unflag:t.flag;
  $("dots").replaceChildren(...S.qs.map((_,k)=>{const d=document.createElement("button");d.className="dot";d.textContent=k+1;
    if(S.ans[k])d.classList.add("ans");if(k===S.i)d.classList.add("cur");if(S.flag[k])d.classList.add("flag");
    if(S.mode==="practice"&&S.ans[k]){d.style.background=S.ans[k]===S.qs[k].a?"var(--good-soft)":"var(--bad-soft)";d.style.borderColor=S.ans[k]===S.qs[k].a?"var(--good)":"var(--bad)";d.style.color=d.style.borderColor}
    d.onclick=()=>{S.i=k;renderQ()};return d}));
}
function choose(L){if(S.mode==="practice"&&S.ans[S.i])return;S.ans[S.i]=L;renderQ()}
function flag(){S.flag[S.i]=!S.flag[S.i];renderQ()}
function go(d){if(S.i+d>=S.qs.length){const left=S.ans.filter(x=>!x).length;if(left&&!confirm(T[lang].confirmFinish(left)))return;finish();return}S.i=Math.max(0,S.i+d);renderQ();scrollTo(0,0)}
function quit(){if(confirm(T[lang].confirmQuit)){clearInterval(timerId);S=null;showSetup()}}
function finish(){
  clearInterval(timerId); S.used=Math.floor((Date.now()-S.t0)/1000);
  const w=new Set(store.get("dsemc_wrong",[]));
  S.qs.forEach((q,k)=>{if(S.ans[k]===q.a)w.delete(qid(q));else w.add(qid(q))});
  store.set("dsemc_wrong",[...w]);
  $("quiz").classList.add("hidden");$("results").classList.remove("hidden");renderResults();scrollTo(0,0);
}
function renderResults(){
  const t=T[lang], n=S.qs.length, c=S.qs.filter((q,k)=>S.ans[k]===q.a).length;
  $("score").textContent=`${Math.round(100*c/n)}%`;
  $("scoreSub").textContent=t.scoreSub(c,n,fmt(S.used));
  $("topicTable").innerHTML=TOPICS.map(k=>{const qs=S.qs.map((q,i)=>[q,i]).filter(([q])=>q.t===k);if(!qs.length)return"";
    const ok=qs.filter(([q,i])=>S.ans[i]===q.a).length,p=Math.round(100*ok/qs.length);
    return `<tr><td>${t.topicsN[k]}</td><td>${ok} / ${qs.length}</td><td style="width:35%"><div class="bar"><i style="width:${p}%"></i></div></td></tr>`}).join("");
  const wrong=S.qs.filter((q,k)=>S.ans[k]!==q.a).length;
  $("redoBtn").textContent=t.redo(wrong);$("redoBtn").classList.toggle("hidden",!wrong);
  renderReview();
}
function renderReview(){
  const t=T[lang], only=$("onlyWrongChip").getAttribute("aria-pressed")==="true";
  $("reviewList").innerHTML=S.qs.map((q,k)=>{const a=S.ans[k],ok=a===q.a;if(only&&ok)return"";
    return `<div class="rev"><div><span class="tag">${t.topicsN[q.t]}</span>${q.x?'<span class="tag ext">*</span>':""}<b>${t.paperQ(q.y,q.n)}</b></div>
      <img class="qimg" src="${img(q)}" alt="" loading="lazy">
      <div>${t.yours}: <span class="${ok?"ok":"no"}">${a||t.none}</span> &nbsp; ${t.key}: <span class="ok">${q.a}</span>${q.p?`<span class="hint">${t.pct(q.p)}</span>`:""}</div></div>`}).join("");
}
function redoWrong(){start(S.qs.filter((q,k)=>S.ans[k]!==q.a))}
function showSetup(){$("quiz").classList.add("hidden");$("results").classList.add("hidden");$("setup").classList.remove("hidden");refresh();scrollTo(0,0)}
document.addEventListener("keydown",e=>{if(!S||$("quiz").classList.contains("hidden"))return;const k=e.key.toUpperCase();
  if("ABCD".includes(k)&&k.length===1)choose(k);else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft"&&S.i>0)go(-1)});

lang=store.get("dsemc_lang","E");
fetch("questions.json").then(r=>r.json()).then(d=>{Q=d;applyLang();buildSetup()});
</script>
</body>
</html>
